<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paystack Payment Tester</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .api-status {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-dot.error {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-success {
            background: #28a745;
        }

        .results {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .results h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .result-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .result-item.success {
            border-left-color: #28a745;
        }

        .result-item.error {
            border-left-color: #dc3545;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-title {
            font-weight: 600;
            color: #333;
        }

        .result-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .result-status.success {
            background: #d4edda;
            color: #155724;
        }

        .result-status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .result-data {
            background: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .payments-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .payment-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .payment-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .payment-reference {
            font-weight: 600;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .payment-amount {
            font-size: 1.2em;
            font-weight: 700;
            color: #28a745;
        }

        .payment-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            font-size: 14px;
            color: #666;
        }

        .payment-detail {
            display: flex;
            flex-direction: column;
        }

        .payment-detail-label {
            font-weight: 600;
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .quick-actions .btn {
            flex: 1;
            padding: 8px 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Paystack Payment Tester</h1>
            <p>Test and manage your Paystack payment integration</p>
        </div>

        <div class="api-status" id="apiStatus">
            <div>
                <strong>API Status:</strong>
                <span id="apiStatusText">Checking...</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <div class="grid">
            <!-- Initialize Payment Card -->
            <div class="card">
                <h2>🚀 Initialize Payment</h2>
                <form id="initializeForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="user@example.com" value="test@example.com">
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" required placeholder="3000" value="3000" min="1">
                    </div>
                    <div class="form-group">
                        <label for="currency">Currency</label>
                        <select id="currency">
                            <option value="KES">KES - Kenyan Shilling</option>
                            <option value="NGN">NGN - Nigerian Naira</option>
                            <option value="GHS">GHS - Ghanaian Cedi</option>
                            <option value="ZAR">ZAR - South African Rand</option>
                            <option value="USD">USD - US Dollar</option>
                        </select>
                    </div>
                    <button type="submit" class="btn" id="initializeBtn">
                        Initialize Payment
                    </button>
                </form>
            </div>

            <!-- Verify Payment Card -->
            <div class="card">
                <h2>✅ Verify Payment</h2>
                <form id="verifyForm">
                    <div class="form-group">
                        <label for="reference">Payment Reference</label>
                        <input type="text" id="reference" required placeholder="Enter payment reference">
                    </div>
                    <button type="submit" class="btn btn-success" id="verifyBtn">
                        Verify Payment
                    </button>
                </form>
            </div>

            <!-- Get Payment Card -->
            <div class="card">
                <h2>🔍 Lookup Payment</h2>
                <form id="lookupForm">
                    <div class="form-group">
                        <label for="lookupReference">Payment Reference</label>
                        <input type="text" id="lookupReference" required placeholder="Enter payment reference">
                    </div>
                    <button type="submit" class="btn btn-secondary" id="lookupBtn">
                        Get Payment Details
                    </button>
                </form>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>📊 Results & Payments</h2>
                <button class="btn" style="width: auto; padding: 8px 16px;" onclick="loadAllPayments()">
                    🔄 Refresh Payments
                </button>
            </div>
            <div id="resultsContainer">
                <div class="empty-state">
                    <p>No results yet. Initialize or verify a payment to see results here.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:4000/paystack';

        // Check API status on load
        checkApiStatus();

        async function checkApiStatus() {
            try {
                const response = await fetch(API_BASE);
                const data = await response.json();
                
                document.getElementById('apiStatusText').textContent = data.message || 'Connected';
                document.getElementById('statusText').textContent = 'Online';
                document.getElementById('statusDot').classList.remove('error');
                
                if (data.environment) {
                    const envInfo = [];
                    if (data.environment.hasSecretKey) envInfo.push('✓ Secret Key');
                    if (data.environment.hasDatabaseUrl) envInfo.push('✓ Database');
                    document.getElementById('apiStatusText').textContent += ' | ' + envInfo.join(', ');
                }
            } catch (error) {
                document.getElementById('apiStatusText').textContent = 'Offline';
                document.getElementById('statusText').textContent = 'Offline';
                document.getElementById('statusDot').classList.add('error');
            }
        }

        // Initialize Payment
        document.getElementById('initializeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('initializeBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Initializing...';

            try {
                const email = document.getElementById('email').value;
                const amount = parseFloat(document.getElementById('amount').value);
                const currency = document.getElementById('currency').value;

                const response = await fetch(`${API_BASE}/initialize`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, amount, currency }),
                });

                const data = await response.json();
                
                if (data.success) {
                    addResult('Payment Initialized', 'success', data);
                    
                    // Open Paystack payment popup
                    if (data.data && data.data.authorization_url) {
                        window.open(data.data.authorization_url, '_blank');
                    }
                    
                    // Auto-fill reference in verify form
                    if (data.data && data.data.reference) {
                        document.getElementById('reference').value = data.data.reference;
                        document.getElementById('lookupReference').value = data.data.reference;
                    }
                } else {
                    addResult('Initialize Payment Failed', 'error', data);
                }
            } catch (error) {
                addResult('Initialize Payment Error', 'error', { message: error.message });
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // Verify Payment
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('verifyBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Verifying...';

            try {
                const reference = document.getElementById('reference').value;

                const response = await fetch(`${API_BASE}/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ reference }),
                });

                const data = await response.json();
                
                if (data.success) {
                    addResult('Payment Verified', 'success', data);
                    loadAllPayments(); // Refresh payments list
                } else {
                    addResult('Verification Failed', 'error', data);
                }
            } catch (error) {
                addResult('Verification Error', 'error', { message: error.message });
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // Lookup Payment
        document.getElementById('lookupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('lookupBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Looking up...';

            try {
                const reference = document.getElementById('lookupReference').value;

                const response = await fetch(`${API_BASE}/payment/${reference}`);
                const data = await response.json();
                
                if (data.success) {
                    addResult('Payment Found', 'success', data);
                } else {
                    addResult('Payment Not Found', 'error', data);
                }
            } catch (error) {
                addResult('Lookup Error', 'error', { message: error.message });
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // Load All Payments
        async function loadAllPayments() {
            try {
                const response = await fetch(`${API_BASE}/payments?limit=20`);
                const data = await response.json();
                
                if (data.success && data.data && data.data.length > 0) {
                    displayPayments(data.data);
                } else {
                    displayPayments([]);
                }
            } catch (error) {
                console.error('Error loading payments:', error);
            }
        }

        function displayPayments(payments) {
            const container = document.getElementById('resultsContainer');
            
            if (payments.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No payments found. Initialize a payment to get started.</p></div>';
                return;
            }

            let html = '<div class="payments-list">';
            payments.forEach(payment => {
                const amount = (payment.amount / 100).toFixed(2);
                const date = new Date(payment.createdAt).toLocaleString();
                
                html += `
                    <div class="payment-item">
                        <div class="payment-item-header">
                            <span class="payment-reference">${payment.reference || 'N/A'}</span>
                            <span class="payment-amount">${payment.currency || 'KES'} ${amount}</span>
                        </div>
                        <div class="payment-details">
                            <div class="payment-detail">
                                <span class="payment-detail-label">Status</span>
                                <span style="color: ${payment.status === 'success' ? '#28a745' : '#dc3545'}; font-weight: 600;">
                                    ${payment.status || 'N/A'}
                                </span>
                            </div>
                            <div class="payment-detail">
                                <span class="payment-detail-label">Currency</span>
                                <span>${payment.currency || 'N/A'}</span>
                            </div>
                            <div class="payment-detail">
                                <span class="payment-detail-label">Date</span>
                                <span>${date}</span>
                            </div>
                        </div>
                        <div class="quick-actions">
                            <button class="btn btn-secondary" style="font-size: 12px; padding: 6px 12px;" 
                                    onclick="document.getElementById('reference').value='${payment.reference}'; document.getElementById('lookupReference').value='${payment.reference}'">
                                Use Reference
                            </button>
                            <button class="btn btn-success" style="font-size: 12px; padding: 6px 12px;" 
                                    onclick="verifyPayment('${payment.reference}')">
                                Verify
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        async function verifyPayment(reference) {
            document.getElementById('reference').value = reference;
            document.getElementById('verifyForm').dispatchEvent(new Event('submit'));
        }

        function addResult(title, status, data) {
            const container = document.getElementById('resultsContainer');
            
            // Remove empty state if present
            if (container.querySelector('.empty-state')) {
                container.innerHTML = '';
            }

            const resultItem = document.createElement('div');
            resultItem.className = `result-item ${status}`;
            resultItem.innerHTML = `
                <div class="result-header">
                    <span class="result-title">${title}</span>
                    <span class="result-status ${status}">${status.toUpperCase()}</span>
                </div>
                <div class="result-data">${JSON.stringify(data, null, 2)}</div>
            `;
            
            container.insertBefore(resultItem, container.firstChild);
            
            // Auto-scroll to top
            resultItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Load payments on page load
        loadAllPayments();
        
        // Auto-refresh payments every 30 seconds
        setInterval(loadAllPayments, 30000);
    </script>
</body>
</html>
