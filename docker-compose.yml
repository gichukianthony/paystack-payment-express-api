version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: paystack
      POSTGRES_PASSWORD: paystack
      POSTGRES_DB: paystack_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  pgdata:
